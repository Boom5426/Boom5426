<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scholar Atlas</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/echarts/5.5.0/echarts.min.js"></script>
<style>
/* Journal-figure styling: white paper, Arial figures, thin dark axes, restrained palette
   (Nature-style figure conventions). Categorical palette validated for CVD separation. */
:root {
  color-scheme: light;
  --paper: #ffffff; --ink: #111111; --ink2: #3a3a3a; --muted: #6b6b6b; --rule: #dcdcdc; --rule-strong: #111111;
  --axis: #272727; --wash: #f6f6f4; --link: #0f4d92; --up: #1e7b34; --down: #b3261e;
  --other: #bdbdbd; --ego: #272727; --cite: #b64342; --edge: #b4b4b4;
  --c1: #3A67AE; --c2: #D0504A; --c3: #1F9A8A; --c4: #D9982C; --c5: #9A4D8E; --c6: #5E9E4A; --c7: #9B7FD1; --c8: #B06A3E;
  --q0: #f2f5fa; --q1: #c9d7ee; --q2: #85a3d4; --q3: #3a67ae; --q4: #1d3a6e;
  --sans: Arial, "Helvetica Neue", Helvetica, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  --serif: "Source Serif 4", Georgia, "Times New Roman", "Songti SC", "SimSun", serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --paper: #151515; --ink: #f2f2f2; --ink2: #cfcfcf; --muted: #9a9a9a; --rule: #333333; --rule-strong: #e6e6e6;
    --axis: #bdbdbd; --wash: #1e1e1e; --link: #8fb3ec; --up: #5bc27a; --down: #f07167;
    --other: #555555; --ego: #f2f2f2; --cite: #e57373; --edge: #4a4a4a;
    --c1: #4A74C2; --c2: #DE5F57; --c3: #26A291; --c4: #BE8A2A; --c5: #B866AB; --c6: #5E9E4A; --c7: #9B7FD1; --c8: #B8764A;
    --q0: #1b2130; --q1: #24365e; --q2: #33589a; --q3: #4a74c2; --q4: #a9c0ec;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --paper: #151515; --ink: #f2f2f2; --ink2: #cfcfcf; --muted: #9a9a9a; --rule: #333333; --rule-strong: #e6e6e6;
  --axis: #bdbdbd; --wash: #1e1e1e; --link: #8fb3ec; --up: #5bc27a; --down: #f07167;
  --other: #555555; --ego: #f2f2f2; --cite: #e57373; --edge: #4a4a4a;
  --c1: #4A74C2; --c2: #DE5F57; --c3: #26A291; --c4: #BE8A2A; --c5: #B866AB; --c6: #5E9E4A; --c7: #9B7FD1; --c8: #B8764A;
  --q0: #1b2130; --q1: #24365e; --q2: #33589a; --q3: #4a74c2; --q4: #a9c0ec;
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; scroll-padding-top: 52px; }
body { margin: 0; background: var(--paper); color: var(--ink); font: 15px/1.6 var(--sans); -webkit-font-smoothing: antialiased; }
a { color: var(--link); text-decoration: none; }
a:hover { text-decoration: underline; }
.wrap { max-width: 1180px; margin: 0 auto; padding: 0 24px; }
@media (max-width: 600px) { .wrap { padding: 0 16px; } }

/* ---------- masthead */
.mast { padding: 36px 0 0; }
.kicker { display: flex; justify-content: space-between; gap: 12px; border-top: 3px solid var(--rule-strong); padding-top: 9px; font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.mast h1 { font-family: var(--serif); font-size: 46px; line-height: 1.06; font-weight: 700; letter-spacing: -0.012em; margin: 22px 0 10px; }
.mast .aff { font-size: 17px; color: var(--ink2); }
.mast .meta { margin-top: 8px; font-size: 13px; color: var(--muted); line-height: 1.7; }
.mast .meta a { margin-right: 16px; }
.facts { display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); border-top: 1px solid var(--rule-strong); border-bottom: 1px solid var(--rule); margin-top: 28px; }
.facts > div { padding: 12px 12px 11px 0; min-width: 0; }
.facts > div + div { padding-left: 14px; border-left: 1px solid var(--rule); }
.facts b { display: block; font-size: 26px; line-height: 1.15; font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; }
.facts span { display: block; font-size: 11.5px; letter-spacing: .04em; color: var(--muted); margin-top: 3px; }
@media (max-width: 900px) {
  .facts { grid-template-columns: repeat(4, minmax(0, 1fr)); }
  .facts > div:nth-child(4n+1) { border-left: 0; padding-left: 0; }
  .facts > div:nth-child(n+5) { border-top: 1px solid var(--rule); }
  .mast h1 { font-size: 36px; }
}
.abstract { margin: 26px 0 0; max-width: 900px; }
.abstract h2 { font: 700 11px/1 var(--sans); letter-spacing: .14em; text-transform: uppercase; margin: 0 0 9px; }
.abstract p { font-family: var(--serif); font-size: 17.5px; line-height: 1.65; margin: 0; }

/* ---------- section nav */
nav.toc { position: sticky; top: 0; z-index: 20; background: var(--paper); border-bottom: 1px solid var(--rule); margin-top: 32px; }
nav.toc .wrap { display: flex; gap: 24px; overflow-x: auto; scrollbar-width: none; }
nav.toc a { padding: 12px 0 9px; font-size: 13px; color: var(--muted); border-bottom: 2px solid transparent; white-space: nowrap; }
nav.toc a:hover { color: var(--ink); text-decoration: none; }
nav.toc a b { color: var(--ink); margin-right: 5px; }
nav.toc a.on { color: var(--ink); border-bottom-color: var(--ink); }

/* ---------- figures */
.fig { margin: 0; padding: 52px 0 6px; }
.fig-head { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px 28px; border-bottom: 1px solid var(--rule-strong); padding-bottom: 9px; margin-bottom: 16px; }
.fig-title { font-size: 19px; line-height: 1.3; font-weight: 700; margin: 0; letter-spacing: -0.003em; }
.fig-title .sep { color: var(--muted); font-weight: 400; margin: 0 9px; }
.takeaway { font-family: var(--serif); font-size: 16px; line-height: 1.62; margin: 2px 0 20px; padding-left: 14px; border-left: 2px solid var(--rule-strong); max-width: 940px; }
.toolbar { display: flex; flex-wrap: wrap; gap: 6px 18px; align-items: center; font-size: 12px; color: var(--muted); }
.toolbar label { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.toolbar select, .toolbar input[type=search] { font: 12px var(--sans); color: var(--ink); background: transparent; border: 0; border-bottom: 1px solid var(--axis); border-radius: 0; padding: 2px 1px; outline-offset: 2px; }
.toolbar input[type=search] { width: 150px; }
.toolbar input[type=range] { width: 100px; accent-color: var(--ink); }
.toolbar input[type=checkbox] { accent-color: var(--ink); margin: 0; }
.toolbar output { color: var(--ink); font-variant-numeric: tabular-nums; }
.panels { display: grid; gap: 30px 40px; }
.g-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.g-hero { grid-template-columns: minmax(0, 1.9fr) minmax(0, 1fr); }
.span-all { grid-column: 1 / -1; }
.rows2 { grid-row: span 2; }
@media (max-width: 900px) { .g-3, .g-hero { grid-template-columns: minmax(0, 1fr); } .rows2 { grid-row: auto; } }
.panel { min-width: 0; }
.panel + .panel.block { margin-top: 34px; }
.ph { display: flex; align-items: baseline; gap: 9px; margin-bottom: 6px; }
.pl { font-size: 16px; font-weight: 700; line-height: 1; }
.pt { font-size: 13px; color: var(--ink2); }
.chart { width: 100%; height: 250px; }
.chart.h-hero { height: 620px; }
.chart.h-mid { height: 380px; }
@media (max-width: 600px) { .chart.h-hero { height: 460px; } }
.legend { font-size: 13px; line-height: 1.62; color: var(--ink2); margin: 22px 0 0; max-width: 1020px; }
.legend b { color: var(--ink); }

/* ---------- inspector, tables, text blocks */
.inspector { margin-top: 22px; border-top: 1px solid var(--rule); padding-top: 12px; font-size: 13px; }
.inspector .lab { font-size: 10.5px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); margin: 0 0 6px; }
.inspector h3 { font-family: var(--serif); font-size: 19px; line-height: 1.32; margin: 0 0 5px; font-weight: 700; }
.insp-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.35fr); gap: 10px 40px; }
@media (max-width: 900px) { .insp-grid { grid-template-columns: minmax(0, 1fr); } }
.inspector ol, .inspector ul { margin: 0; padding-left: 20px; }
.inspector li { margin-bottom: 7px; line-height: 1.5; }
.inspector .scroll { max-height: 380px; overflow: auto; padding-right: 6px; }
.inspector p { margin: 4px 0; }
.meta { color: var(--muted); font-size: 12px; }
.lk { cursor: pointer; color: var(--link); }
.lk:hover { text-decoration: underline; }
.tag { display: inline-block; font-size: 11px; line-height: 1.5; border: 0.6px solid var(--axis); padding: 0 5px; margin: 2px 4px 0 0; color: var(--ink2); white-space: nowrap; }
.tag.cite { color: var(--cite); border-color: var(--cite); }
.sw { display: inline-block; width: 10px; height: 10px; border: 0.6px solid var(--axis); vertical-align: -1px; margin-right: 7px; flex: none; }
table.bk { width: 100%; border-collapse: collapse; font-size: 13px; border-top: 1.5px solid var(--ink); border-bottom: 1.5px solid var(--ink); }
table.bk th { text-align: left; font-size: 12px; font-weight: 700; padding: 8px 14px 7px 0; border-bottom: 1px solid var(--ink); white-space: nowrap; }
table.bk td { padding: 8px 14px 8px 0; vertical-align: top; line-height: 1.5; }
table.bk tbody tr + tr td { border-top: 1px solid var(--rule); }
.num { text-align: right !important; font-variant-numeric: tabular-nums; white-space: nowrap; }
.tablewrap { overflow-x: auto; }
details.all { margin-top: 22px; }
details.all summary { cursor: pointer; font-size: 13px; color: var(--ink2); padding: 6px 0; }
.empty { color: var(--muted); font-size: 13px; padding: 24px 0; }
.warn { border: 1px dashed var(--axis); padding: 10px 14px; color: var(--ink2); margin: 18px 0 0; font-size: 13px; }

/* ---------- research phases (figure 4b) */
.strip { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(260px, 1fr); overflow-x: auto; border-top: 1px solid var(--rule); }
.phase { padding: 14px 20px 6px 0; min-width: 0; }
.phase + .phase { padding-left: 20px; border-left: 1px solid var(--rule); }
.phase .cbar { display: flex; gap: 1px; height: 5px; margin-bottom: 11px; }
.phase .cbar span { display: block; height: 100%; }
.phase .yr { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-variant-numeric: tabular-nums; }
.phase h3 { font-family: var(--serif); font-size: 19px; line-height: 1.3; margin: 5px 0 6px; font-weight: 700; }
.phase .note { font-size: 13.5px; line-height: 1.58; color: var(--ink2); margin: 0 0 6px; }
.phase .k { font-size: 10.5px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin: 12px 0 3px; }
.phase .v { font-size: 13px; line-height: 1.55; }
.phase ol.v { padding-left: 18px; margin: 0; }
.phase ol.v li { margin-bottom: 4px; }
.up { color: var(--up); white-space: nowrap; } .down { color: var(--down); white-space: nowrap; }
.nw { white-space: nowrap; }
@media (max-width: 700px) { .strip { grid-auto-flow: row; grid-auto-columns: auto; } .phase + .phase { border-left: 0; padding-left: 0; border-top: 1px solid var(--rule); } }

/* ---------- affiliation timeline (figure 3e) */
.gantt { font-size: 12.5px; }
.gantt .row, .gantt .axis { display: grid; grid-template-columns: minmax(150px, 320px) minmax(0, 1fr) 60px; gap: 14px; align-items: center; }
.gantt .row { padding: 5px 0; }
.gantt .bar { position: relative; height: 12px; }
.gantt .bar span { position: absolute; top: 0; height: 12px; background: var(--c1); border: 0.6px solid var(--axis); }
.gantt .axis { color: var(--ink2); font-size: 11px; margin-top: 2px; }
.gantt .ticks { position: relative; height: 18px; border-top: 1px solid var(--axis); }
.gantt .ticks span { position: absolute; top: 3px; transform: translateX(-50%); font-variant-numeric: tabular-nums; }
.gantt .ticks span::before { content: ""; position: absolute; top: -4px; left: 50%; height: 3px; border-left: 1px solid var(--axis); }

/* ---------- methods & footer */
.methods { max-width: 920px; font-size: 14px; line-height: 1.72; color: var(--ink2); }
.methods h3 { font-size: 14px; color: var(--ink); margin: 20px 0 4px; }
.methods ul { padding-left: 20px; margin: 0; }
.methods li { margin-bottom: 4px; }
footer { color: var(--muted); font-size: 12px; padding: 34px 0 44px; margin-top: 40px; border-top: 1px solid var(--rule); }
.langs { display: inline-flex; gap: 2px; margin-left: 14px; }
.langs button { font: inherit; letter-spacing: inherit; text-transform: none; color: var(--muted); background: none; border: 0; border-bottom: 1px solid transparent; padding: 0 3px; cursor: pointer; }
.langs button.on { color: var(--ink); border-bottom-color: var(--ink); }
</style>
</head>
<body>
<div class="wrap"><header class="mast" id="top"></header></div>
<nav class="toc"><div class="wrap">
  <a href="#fig1"><b>1</b><span data-en="Output &amp; impact">发表与影响力</span></a><a href="#fig2"><b>2</b><span data-en="Collaboration">合作网络</span></a><a href="#fig3"><b>3</b><span data-en="Institutions">单位分布</span></a><a href="#fig4"><b>4</b><span data-en="Research evolution">研究演化</span></a><a href="#fig5"><b>5</b><span data-en="Paper network">论文主题网络</span></a><a href="#methods"><b>M</b><span data-en="Methods">方法与数据</span></a>
</div></nav>
<main class="wrap">
  <div id="libwarn"></div>

  <figure class="fig" id="fig1">
    <div class="fig-head"><h2 class="fig-title">Fig. 1<span class="sep">|</span><span data-en="Publication output and scholarly impact">发表节奏与学术影响力</span></h2></div>
    <div class="panels g-3">
      <div class="panel"><div class="ph"><span class="pl">a</span><span class="pt" data-en="Papers per year">每年发表论文数</span></div><div class="chart" id="c-pubs"></div></div>
      <div class="panel"><div class="ph"><span class="pl">b</span><span class="pt" id="cites-title" data-en="Citations per year">每年被引次数</span></div><div class="chart" id="c-cites"></div></div>
      <div class="panel"><div class="ph"><span class="pl">c</span><span class="pt" data-en="Core keywords">核心关键词</span></div><div class="chart" id="c-kw"></div></div>
    </div>
    <p class="legend" id="leg1"></p>
  </figure>

  <figure class="fig" id="fig2">
    <div class="fig-head"><h2 class="fig-title">Fig. 2<span class="sep">|</span><span data-en="Ego-centred collaboration network">以本人为中心的合作网络</span></h2>
      <div class="toolbar">
        <label><span data-en="Show">显示</span> <input type="range" id="co-top" min="10" max="200" step="5" value="60"><output id="co-top-v">60</output><span data-en="people">人</span></label>
        <label><span data-en="Min. papers">至少合作</span> <select id="co-min"><option value="1" data-en="1">1 篇</option><option value="2" data-en="2">2 篇</option><option value="3" data-en="3">3 篇</option><option value="5" data-en="5">5 篇</option></select></label>
        <label><span data-en="Colour by">着色</span> <select id="co-color"><option value="inst" data-en="Institution">机构</option><option value="country" data-en="Country/region">国家/地区</option><option value="phase" data-en="First-collaboration phase">首次合作阶段</option></select></label>
        <label><input type="checkbox" id="co-noego"><span data-en="Hide self">隐藏本人</span></label>
      </div>
    </div>
    <div id="note2"></div>
    <div class="panels g-hero">
      <div class="panel rows2"><div class="ph"><span class="pl">a</span><span class="pt" data-en="Co-author network">合作者网络</span></div><div class="chart h-hero" id="c-co"></div></div>
      <div class="panel"><div class="ph"><span class="pl">b</span><span class="pt" data-en="Most frequent co-authors">合作最多的合作者</span></div><div class="chart" id="c-cotop" style="height:340px"></div></div>
      <div class="panel"><div class="ph"><span class="pl">c</span><span class="pt" data-en="New and returning co-authors per year">每年新增与延续的合作者</span></div><div class="chart" id="c-conew" style="height:220px"></div></div>
    </div>
    <div class="inspector" id="co-side"></div>
    <p class="legend" id="leg2"></p>
  </figure>

  <figure class="fig" id="fig3">
    <div class="fig-head"><h2 class="fig-title">Fig. 3<span class="sep">|</span><span data-en="Institutions and geography of collaborators">合作机构与地域分布</span></h2></div>
    <div id="note3"></div>
    <div class="panels g-hero">
      <div class="panel"><div class="ph"><span class="pl">a</span><span class="pt" data-en="Top 15 partner institutions">合作机构 Top 15</span></div><div class="chart h-mid" id="c-inst"></div></div>
      <div class="panel"><div class="ph"><span class="pl">b</span><span class="pt" data-en="Countries / regions">国家 / 地区</span></div><div class="chart h-mid" id="c-country"></div></div>
      <div class="panel"><div class="ph"><span class="pl">c</span><span class="pt" data-en="Institution × year">机构 × 年份</span></div><div class="chart h-mid" id="c-inst-year"></div></div>
      <div class="panel"><div class="ph"><span class="pl">d</span><span class="pt" data-en="Institution types">机构类型</span></div><div class="chart" id="c-type"></div></div>
      <div class="panel span-all"><div class="ph"><span class="pl">e</span><span class="pt" data-en="Own affiliations over time">本人署名机构变迁</span></div><div class="gantt" id="ego-aff"></div></div>
    </div>
    <p class="legend" id="leg3"></p>
  </figure>

  <figure class="fig" id="fig4">
    <div class="fig-head"><h2 class="fig-title">Fig. 4<span class="sep">|</span><span data-en="Research topics and their evolution">研究主题与阶段演化</span></h2>
      <div class="toolbar">
        <label><span data-en="Topics">主题数</span> <select id="k-sel"></select></label>
        <label><span data-en="Phases">阶段数</span> <select id="p-sel"></select></label>
      </div>
    </div>
    <div id="note4"></div>
    <div class="panel"><div class="ph"><span class="pl">a</span><span class="pt" data-en="Topic composition of papers per year">各年份论文的主题构成</span></div><div class="chart h-mid" id="c-evo"></div></div>
    <div class="panel block"><div class="ph"><span class="pl">b</span><span class="pt" data-en="Research phases">研究阶段</span></div><div class="strip" id="phases"></div></div>
    <div class="panel block"><div class="ph"><span class="pl">c</span><span class="pt" data-en="Research topics">研究主题一览</span></div><div class="tablewrap" id="topic-table"></div></div>
    <p class="legend" id="leg4"></p>
  </figure>

  <figure class="fig" id="fig5">
    <div class="fig-head"><h2 class="fig-title">Fig. 5<span class="sep">|</span><span data-en="Paper–topic network and research core">论文主题网络与研究中心</span></h2>
      <div class="toolbar">
        <label><span data-en="Similarity ≥">相似度阈值</span> <input type="range" id="pn-thr" min="0.05" max="0.5" step="0.01" value="0.12"><output id="pn-thr-v">0.12</output></label>
        <label><span data-en="Neighbours">邻居数</span> <select id="pn-k"><option>1</option><option>2</option><option selected>3</option><option>4</option><option>5</option><option>8</option></select></label>
        <label><input type="checkbox" id="pn-sim" checked><span data-en="Similarity">内容相似</span></label>
        <label><input type="checkbox" id="pn-cite" checked><span data-en="Citations">相互引用</span></label>
        <label><input type="checkbox" id="pn-co"><span data-en="Shared co-authors">共同合作者</span></label>
        <label><input type="search" id="pn-q" placeholder="搜索论文标题" data-en-ph="Search paper titles"></label>
      </div>
    </div>
    <div id="center-box"></div>
    <div class="panels g-hero">
      <div class="panel rows2"><div class="ph"><span class="pl">a</span><span class="pt" data-en="Paper network">论文网络</span></div><div class="chart h-hero" id="c-pn"></div></div>
      <div class="panel"><div class="ph"><span class="pl">b</span><span class="pt" data-en="Links between topics">主题之间的连接</span></div><div class="chart" id="c-tn" style="height:300px"></div></div>
      <div class="panel"><div class="ph"><span class="pl">c</span><span class="pt" data-en="Most central papers">网络中心性最高的论文</span></div><div class="chart" id="c-pr" style="height:260px"></div></div>
    </div>
    <div class="inspector" id="pn-side"></div>
    <details class="all"><summary data-en="All papers (ranked by network centrality)">全部论文（按网络中心性排序）</summary><div class="tablewrap" id="paper-table"></div></details>
    <p class="legend" id="leg5"></p>
  </figure>

  <section class="fig methods" id="methods">

s://openalex.org/W2328434568","https://openalex.org/W2751303714","https://openalex.org/W2765793020","https://openalex.org/W2788210750","https://openalex.org/W2796497263","https://openalex.org/W2809503262","https://openalex.org/W2905535961","https://openalex.org/W2953073956","https://openalex.org/W2962677366","https://openalex.org/W2962858109","https://openalex.org/W2963779825","https://openalex.org/W2963936013","https://openalex.org/W2964225075","https://openalex.org/W2979062293","https://openalex.org/W2985891137","https://openalex.org/W2997998901","https://openalex.org/W3012080662","https://openalex.org/W3030520226","https://openalex.org/W3035253074","https://openalex.org/W3046768359","https://openalex.org/W3094502228","https://openalex.org/W3106483999","https://openalex.org/W3127579051","https://openalex.org/W3139180514","https://openalex.org/W3158124198","https://openalex.org/W3166058839","https://openalex.org/W3166396011","https://openalex.org/W3176482836","https://openalex.org/W6676368796","https://openalex.org/W6754669440","https://openalex.org/W6765549164","https://openalex.org/W6768454739","https://openalex.org/W6774983715","https://openalex.org/W6778485988","https://openalex.org/W6782259796","https://openalex.org/W6784333009","https://openalex.org/W6791353385","https://openalex.org/W6792515593","https://openalex.org/W6794713401"]}],"group_by":[]}],"details":[{"title":"Permutation-Consistent Variational Encoding for Incomplete Multi-View Multi-Label Classification","authors":[{"name":"Chengliang Liu","affiliations":[]},{"name":"Bo Li","affiliations":[]},{"name":"Bob Zhang","affiliations":[]},{"name":"Xiaoling Luo","affiliations":[]},{"name":"Yabo Liu","affiliations":[]},{"name":"Jie Wen","affiliations":[]}],"year":2026,"venue":"The Fourteenth International Conference on Learning Representations","abstract":"Incomplete multi-view multi-label learning is fundamentally an information integration problem under simultaneous view and label incompleteness. We introduce Permutation-Consistent Variational Encoding framework (PCVE) with an information bottleneck strategy, which learns variational representations capable of aggregating shared semantics across views while remaining robust to incompleteness. PCVE formulates a principled objective that maximizes a variational evidence lower bound to retain task-relevant information, and introduces a permutation-consistent regularization to encourage distributional consistency among representations that encode the same target semantics from different views. This regularization acts as an information alignment mechanism that suppresses view-private redundancy and mitigates over-alignment, thereby improving both sufficiency and consistency of the learned representations. To address missing labels, PCVE further incorporates a masked multi-label learning objective that leverages available supervision while modeling label dependencies. Extensive experiments across diverse benchmarks and missing ratios demonstrate consistent gains over state-of-the-art methods in multi-label classification, while enabling reliable inference of missing views without explicit imputation. Analyses corroborate that the proposed information-theoretic formulation improves cross-view semantic cohesion and preserves discriminative capacity, underscoring the effectiveness and generality of PCVE for incomplete multi-view multi-label learning.","doi":"","url":"https://proceedings.iclr.cc/paper_files/paper/2026/hash/fd8f0d6175c930e860bef686a6fcaeeb-Abstract-Conference.html","source":"scholar-page"},{"title":"CellScientist: Dual-Space Hierarchical Orchestration for Closed-Loop Refinement of Virtual Cell Models","authors":[{"name":"Mengran Li","affiliations":[]},{"name":"Bo Li","affiliations":[]},{"name":"Jiaying Wang","affiliations":[]},{"name":"Wenbin Xing","affiliations":[]},{"name":"Yixuan Dong","affiliations":[]},{"name":"Chengyang Zhang","affiliations":[]},{"name":"Hongliang Zhang","affiliations":[]},{"name":"Yuzhong Peng","affiliations":[]},{"name":"Jinlin Wu","affiliations":[]},{"name":"Bob Zhang","affiliations":[]},{"name":"Bingo Wing-Kuen Ling","affiliations":[]},{"name":"Fuji Yang","affiliations":[]},{"name":"Zhen Lei","affiliations":[]},{"name":"Jiebo Luo","affiliations":[]},{"name":"Zelin Zang","affiliations":[]}],"year":2026,"venue":"arXiv preprint arXiv:2605.07335","abstract":"Virtual Cell Modeling (VCM) requires models that not only predict perturbation responses, but also support targeted revision when predictions fail. Current LLM-assisted modeling workflows face a refinement-routing problem: prediction discrepancies are observed through executable implementations, but the relevant revision may involve the modeling assumption, representation design, implementation, or task constraint. Without structured feedback propagation across these levels, iterative refinement may repair code while failing to revise the assumption responsible for the discrepancy. We propose CellScientist, a dual-space hierarchical framework that couples a high-level hypothesis space with a low-level executable implementation space. CellScientist represents modeling decisions as structured states, realizes them as admissible programs under task and interface constraints, and routes execution discrepancies back to targeted hypothesis or implementation updates. This enables a closed Hypothesis -> Implementation -> Hypothesis loop where failures become structured signals for model refinement rather than debugging events. Across morphology and transcriptomic benchmarks, with additional single-cell perturbation evaluations, the final executable models selected by CellScientist improve over reference baselines under fixed split and evaluation protocols, while the workflow produces auditable refinement traces.","doi":"","url":"https://arxiv.org/abs/2605.07335","source":"scholar-page"},{"title":"VCDesign: Finite-Budget Intervention Design for Virtual Cells","authors":[{"name":"Bo Li","affiliations":[]},{"name":"Lin Wang","affiliations":[]},{"name":"Bob Zhang","affiliations":[]},{"name":"Mengran Li","affiliations":[]},{"name":"Zhenchao Tang","affiliations":[]},{"name":"Chengyang Zhang","affiliations":[]},{"name":"Minghao Sun","affiliations":[]},{"name":"Chengliang Liu","affiliations":[]},{"name":"Zhiyuan Liu","affiliations":[]},{"name":"Yang Zhang","affiliations":[]}],"year":2026,"venue":"Manuscript","abstract":"Virtual-cell models are usually judged by how well they predict perturbation effects or recover the intervention behind a cellular transition. Experimental planning asks a different question: given a desired cell state and a budget for only a few experiments, which interventions should be tested? We introduce VCDesign, which formulates target-conditioned intervention design as finite-budget ranking over a variable candidate library and scores the top-ranked candidates by their measured outcomes. For candidates whose own responses are unavailable for effect learning, we develop VCDesign-CED, which learns from existing perturbation measurements how biological knowledge predicts a candidate’s effect and combines the inferred effects with direct candidate scoring. In CRISPRi Perturbseq screens of three held-out cell lines, VCDesign-CED raises budgeted utility at 20 selections by 0.049 over direct scoring alone and selects 1.11 more of the top-5% candidates on average. When a candidate’s response has been measured in other cell lines, retrieving that response works better, and routing candidates by response availability further improves mixed libraries. Larger perturbation atlases and informative candidate knowledge improve design for these candidates, whereas the richer effect models we tested do not, and prediction accuracy does not reliably rank nearby models by their design utility.","doi":"","url":"https://boom5426.github.io/VCDesign-CED/","source":"homepage"},{"title":"Measurement resolution constrains fine-grained perturbation prediction","authors":[{"name":"Bo Li","affiliations":["PAMI Research Group, Department of Artificial Intelligence, University of Macau, Macau SAR","Department of Computer Science, School of Computing, National University of Singapore, Singapore"]},{"name":"Chengyang Zhang","affiliations":["College of Computer Science, Sichuan University, Chengdu, China","Department of Pathology and Institute of Clinical Pathology, West China Hospital, Sichuan University, Chengdu, China"]},{"name":"Mengran Li","affiliations":["Shenzhen Loop Area Institute, Shenzhen, Guangdong, China","School of Intelligent Systems Engineering, Sun Yat-sen University, Shenzhen, China"]},{"name":"Bob Zhang","affiliations":["PAMI Research Group, Department of Artificial Intelligence, University of Macau, Macau SAR","Centre for Artificial Intelligence and Robotics, Institute of Collaborative Innovation, University of Macau, Macau SAR"]},{"name":"Lin Wang","affiliations":["Center for AI and Computational Biology, Institute of Systems Medicine, Chinese Academy of Medical Sciences, Suzhou, China","State Key Laboratory of Common Mechanism Research for Major Diseases, Institute of Systems Medicine, Chinese Academy of Medical Sciences, Suzhou, China"]},{"name":"Zhenchao Tang","affiliations":["AI for Life Sciences Lab, Tencent, Shenzhen, China"]},{"name":"Jun Liu","affiliations":["Cancer Science Institute of Singapore, National University of Singapore, Singapore"]},{"name":"Chengliang Liu","affiliations":["PAMI Research Group, Department of Artificial Intelligence, University of Macau, Macau SAR"]},{"name":"Chen Wei","affiliations":["School of Economics and Management, Xi'an University of Posts and Telecommunications, Xi'an, Shaanxi, China"]},{"name":"Yuhao Yi","affiliations":["College of Computer Science, Sichuan University, Chengdu, China","Department of Pathology and Institute of Clinical Pathology, West China Hospital, Sichuan University, Chengdu, China"]},{"name":"Jiancheng Lv","affiliations":["College of Computer Science, Sichuan University, Chengdu, China"]},{"name":"Yang Zhang","affiliations":["Department of Computer Science, School of Computing, National University of Singapore, Singapore","Center for AI and Computational Biology, Institute of Systems Medicine, Chinese Academy of Medical Sciences, Suzhou, China","State Key Laboratory of Common Mechanism Research for Major Diseases, Institute of Systems Medicine, Chinese Academy of Medical Sciences, Suzhou, China","Cancer Science Institute of Singapore, National University of Singapore, Singapore","Department of Biochemistry, Yong Loo Lin School of Medicine, National University of Singapore, Singapore"]}],"year":2026,"venue":"Manuscript","abstract":"Virtual-cell models are increasingly evaluated at finer biological resolution, yet the experimental responses used as prediction targets may not reproducibly resolve the distinctions that models are asked to predict. Here we introduce PertResolve, a measurement-resolution framework that separates perturbation detection, perturbation identification and response prediction, and interprets model performance against the distinctions reproducibly supported by the measurement. We examine this problem using the allele-resolved arm of PertResolve-Bench, comprising 470 coding-variant conditions in TP53, KRAS, GATA1 and JAK1 and 321,043 cells. Feature-based predictors and released perturbation-prediction frameworks recovered substantial transcriptional direction, but this recovery was dominated by gene-shared structure and did not translate into reliable full-pool allele identification. Split-half references showed that similarly weak allele-identification scores can arise for different reasons: TP53 and KRAS were measurement-limited at the evaluated allele resolution, whereas JAK1 contained substantial reproducible allele-specific structure that current models recovered only partially. We then extended PertResolve-Bench to 31 configurations from 14 public perturbation resources, showing that detection depended on perturbation signal relative to within-condition variation, whereas identification depended on separation from nearby competitors. Repeated pilot– evaluation analyses provided an aggregate diagnostic for early detection triage, while reliable model ranking depended jointly on measurement reproducibility, model separation and benchmark size. Measurement resolution therefore constrains which biological distinctions fine-grained perturbation prediction can meaningfully evaluate and provides a practical basis for perturbation-benchmark design.","doi":"","url":"https://boom5426.github.io/PertResolve/","source":"homepage"},{"title":"DrugDis: Disentangling general and context-specific effects in drug-response prediction","authors":[{"name":"Bo Li","affiliations":["PAMI Research Group, Department of Artificial Intelligence, University of Macau, Macau SAR","Department of Computer Science, School of Computing, National University of Singapore, Singapore"]},{"name":"Chengliang Liu","affiliations":["PAMI Research Group, Department of Artificial Intelligence, University of Macau, Macau SAR"]},{"name":"Yuzhong Peng","affiliations":["Faculty of Health Sciences, University of Macau, Macau SAR"]},{"name":"Bob Zhang","affiliations":["PAMI Research Group, Department of Artificial Intelligence, University of Macau, Macau SAR","Centre for Artificial Intelligence and Robotics, Institute of Collaborative Innovation, University of Macau, Macau SAR"]},{"name":"Qing Wang","affiliations":["Department of Health Outcomes and Biomedical Informatics, College of Medicine, University of Florida, Florida, USA"]},{"name":"Pinxian Zeng","affiliations":["PAMI Research Group, Department of Artificial Intelligence, University of Macau, Macau SAR"]},{"name":"Mengran Li","affiliations":["Shenzhen Loop Area Institute, Shenzhen, Guangdong, China"]},{"name":"Shenghui Huang","affiliations":["Department of Molecular Biotechnology and Health Sciences, University of Turin, Turin, Italy"]},{"name":"Chuxia Deng","affiliations":["Faculty of Health Sciences, University of Macau, Macau SAR"]},{"name":"Yang Zhang","affiliations":["Department of Computer Science, School of Computing, National University of Singapore, Singapore","Cancer Science Institute of Singapore, National University of Singapore, Singapore","Department of Biochemistry, Yong Loo Lin School of Medicine, National University of Singapore, Singapore"]}],"year":2026,"venue":"Manuscript","abstract":"Predicting cellular responses across perturbations and biological contexts is a central goal of AI virtual cells, yet aggregate prediction scores do not distinguish general response tendencies from contextspecific effects. Here we introduce DrugDis, a component-resolved framework that applies an exact orthogonal decomposition to measured and predicted responses on the same observed pairs, separating additive effects from drug–sample interactions. It evaluates interaction direction, amplitude and prediction error separately, using cross-assay reproducibility as an empirical reference where repeated measurements are available. Across 3.14 million drug–sample pairs, additive effects accounted for 75.8% of response variance, and 59–83% within each of the five largest response resources. Under held-out cell lines, a model with an aggregate correlation of 0.86 recovered interactions at a correlation of only 0.32. Representation comparisons depended on the evaluated component, decoder and distribution shift, while holding out cell lines or compounds concentrated error in different components. Matched component supervision improved interaction direction for held-out compounds and in zero-shot organoid transfer, but consistently reduced interaction error only for held-out compounds. Different evaluation criteria changed model selection without improving selectivity error on independent GDSC2 measurements. DrugDis reveals which response structures underpin predictive performance, providing a clearer basis for comparing   net = { edges, adj, pr, btw, part, prRank: rankOf(pr), btwRank: rankOf(btw), tW, tInner, tStrength, tPR, center, thr };
}

function axis(extra) {

let coColorOf = () => T.other, coModeText = '', coShown = 0;
function coCategories(list, mode) {
  let keyOf, names;
  if (mode === 'phase') {
    names = phases.map((ph, i) => L('阶段 ' + (i + 1) + '（' + yrRange(ph.y0, ph.y1) + '）', 'Phase ' + (i + 1) + ' (' + yrRange(ph.y0, ph.y1) + ')'));
    keyOf = c => { const x = phaseOfYear(c.first); return x < 0 ? null : names[x]; };
  } else {
    const get = mode === 'inst' ? (c => c.inst || '') : (c => c.country ? countryName(c.country) : '');
    const cnt = new Map(); list.forEach(c => { const v = get(c); if (v) inc(cnt, v); });
    names = [...cnt].sort((a, b) => b[1] - a[1]).slice(0, 7).map(x => x[0]);
    keyOf = c => { const v = get(c); return names.includes(v) ? v : null; };
  }
  const cats = names.map((n, i) => ({ name: n, itemStyle: { color: T.series[i % 8] } }));
  cats.push({ name: L('其他 / 未知', 'Other / unknown'), itemStyle: { color: T.other } });
  cats.push({ name: L('本人', 'Scholar'), itemStyle: { color: T.ego } });
  const catIndex = c => { const v = keyOf(c); const i = v == null ? -1 : names.indexOf(v); return i < 0 ? names.length : i; };
  return { cats, catIndex, colorOf: c => cats[catIndex(c)].itemStyle.color };
}

function edgeReason(e, from) {
  const other = e.s === from ? e.t : e.s, out = [];
  if (e.sim) out.push('<span class="tag">' + L('相似 ', 'similarity ') + e.sim.toFixed(2) + '</span>');
  e.cites.forEach(([a]) => out.push('<span class="tag cite">' + (a === from ? L('引用了它 →', 'cites it →') : L('← 被它引用', '← cited by it')) + '</span>'));
  if (e.co) out.push('<span class="tag">' + L('共同合作者 ', 'shared co-authors ') + e.co + '</span>');
  const st = e.sim ? sharedTerms(from, other) : [];
  return out.join('') + (st.length ? ' <span class="meta">' + L('共同词：', 'shared terms: ') + st.map(esc).join(L('、', ', ')) + '</span>' : '');
}
function renderPaperNet() {

  if (papers.some(p => paperTopic[p.i] < 0)) cats.push({ name: topicName(-1), itemStyle: { color: T.other } });
  const catOf = t => t < 0 ? cats.length - 1 : t;
  const labelSet = new Set([...net.prRank.keys()].filter(i => net.prRank[i] <= Math.min(10, Math.ceil(N / 5))));
  const nodes = papers.map(p => ({ id: String(p.i), name: p.title, value: p.citations, category: catOf(paperTopic[p.i]),
    symbolSize: 7 + 20 * Math.sqrt(Math.log1p(p.citations) / Math.log1p(maxC)), label: { show: labelSet.has(p.i) } }));
  const links = net.edges.map(e => {
    const cite = e.cites.length > 0;
    const l = { source: String(cite ? e.cites[0][0] : e.s), target: String(cite ? e.cites[0][1] : e.t), value: +e.w.toFixed(3),
      lineStyle: cite ? { color: T.cite, width: 1.1, opacity: 0.9, type: 'solid' }
        : e.sim ? { color: T.edge, width: 0.5 + 2.5 * Math.min(1, e.sim * 2), opacity: 0.8, type: 'solid' }
        : { color: T.muted, width: 0.8, opacity: 0.6, type: 'dashed' } };
    if (cite) { l.symbol = ['none', 'arrow']; l.symbolSize = [0, 6]; }
    return l;
  });

        const st = e && e.sim ? sharedTerms(a, b) : [];

          (e && e.cites.length ? L(' · 直接引用', ' · direct citation') : '') + (e && e.co ? L(' · 共同合作者 ', ' · shared co-authors ') + e.co : '') + (st.length ? '<br>' + L('共同词：', 'shared terms: ') + st.map(esc).join(L('、', ', ')) : '');
      }

        L('中心性排名 ' + net.prRank[q.i] + ' · 连接 ' + net.adj[q.i].length + ' 篇', 'Centrality rank ' + net.prRank[q.i] + ' · ' + net.adj[q.i].length + ' links');
    } }),
    legend: legendStyle({ data: cats.map(x => x.name) }),
    series: [{
      type: 'graph', layout: 'force', roam: true, draggable: true, top: 44, bottom: 10, left: 10, right: 10,
      data: nodes, links, categories: cats,
      itemStyle: { borderColor: T.axis, borderWidth: 0.6 },
      // spread small networks over the canvas, keep large ones compact
      force: { repulsion: N <= 40 ? 210 : N <= 150 ? 160 : N <= 300 ? 110 : 60, gravity: N <= 40 ? 0.09 : 0.1, edgeLength: N <= 40 ? [40, 120] : [24, 105], friction: 0.2, layoutAnimation: N > 600 },
      label: { position: 'right', color: T.ink, fontSize: 11, fontFamily: FONT, textBorderColor: T.paper, textBorderWidth: 2.5, formatter: p => shortTitle(p.name, 28) },
      labelLayout: { hideOverlap: true },
      lineStyle: { curveness: 0.1 },

function renderTopicNet() {

function renderPR() {

      '标注了网络中最核心的几篇论文；可拖动节点、滚轮缩放。<b>b</b>，主题之间的联系：节点面积随论文数增加，连线越粗联系越紧密，粗黑描边为研究中心。<b>c</b>，网络中最核心的 10 篇论文（按 PageRank 排序，最高者记为 100），右侧为发表年份。点击 a 中的节点或 c 中的圆点，可在下方查看每条连接的依据。',

/* ====================================================================== orchestration */
// Data-quality checks for the agent writing insights.json (never shown to readers): everything listed here
// must be resolved or explained before the report is delivered.
function qualityChecks() {
  const lastName = n => { const t = nameToks(n); return t.length ? t[t.length - 1] : ''; };
  const names = new Map(); coList.forEach(c => inc(names, c.name.toLowerCase()));
  const qa = {
    duplicate_names: [...names].filter(([, k]) => k > 1).map(([n]) => n),
    initials_only_names: coList.filter(c => { const t = nameToks(c.name); return t.length > 1 && t.slice(0, -1).every(x => x.length === 1); }).map(c => c.name),
    title_only_papers: papers.filter(p => p.source === 'scholar').map(p => p.title),
    scholar_missing_from_byline: papers.filter(p => p.egoIdx < 0).map(p => p.title),
    // Scholar entries that look like author lists or other garbled imports, and items that are not research papers
    suspicious_titles: papers.filter(p => /[a-z]\d+\s*,/i.test(p.title) || (p.title.match(/,/g) || []).length >= 4).map(p => p.title),
    non_research_items: papers.filter(p => /^(correspondence|reply|response to|erratum|errata|correction|corrigendum|retraction|retracted|ed summary|editor'?s summary|editorial|comment on|author correction|publisher correction)\b/i.test(p.title.trim())).map(p => p.title),
    author_mismatch: [], year_mismatch: [], topic_outliers: [],
    own_affiliations: [...egoAff.values()].map(g => g.name + ' (' + Math.min(...g.years) + '–' + Math.max(...g.years) + ', ' + g.n + ' papers)')
  };
  for (const p of papers) {
    if (p.source !== 'both') continue;
    const sch = (p.schAuthors || '').split(',').map(x => x.trim()).filter(x => x && !/^(\.\.\.|…)$/.test(x)).map(lastName).filter(Boolean);
    const byl = p.authors.map(a => lastName(a.name));
    if (sch.length >= 2 && sch.filter(x => byl.includes(x)).length / sch.length < 0.6)
      qa.author_mismatch.push(p.title + ' | Scholar: ' + p.schAuthors + ' | matched record: ' + p.authors.map(a => a.name).join(', '));
    if (p.year && p.oaYear && Math.abs(p.year - p.oaYear) > 1) qa.year_mismatch.push(p.title + ' | Scholar ' + p.year + ' vs record ' + p.oaYear);
  }
  // papers whose content is closer to another topic's centre than to their own
  const cents = topics.map(t => { let s = 0; for (const v of t.mean) s += v * v; const n = Math.sqrt(s) || 1; return t.mean.map(v => v / n); });
  for (const p of papers) {
    const own = paperTopic[p.i];
    if (own < 0 || !vecs[p.i].idx.length || cents.length < 2) continue;
    const sims = cents.map(c => dotC(vecs[p.i], c));
    const best = sims.indexOf(Math.max(...sims));
    if (best !== own && sims[best] - sims[own] > 0.03) qa.topic_outliers.push({ paper: p.title, topic: own, closer_to: best, similarity: [+sims[own].toFixed(2), +sims[best].toFixed(2)] });
  }
  return qa;
}
function exportAnalysis() {
  window.SCHOLAR_ANALYSIS = {
    qa: qualityChecks(),
    name: egoName, affiliation: PROF.affiliation || '', n_papers: N, matched_openalex: papers.filter(p => p.source === 'both').length,
    k: K, k_candidates: kCands.map(k => ({ k, silhouette: +kRuns.get(k).sil.toFixed(3) })), phases_count: phases.length,
    topics: topics.map(t => ({ id: t.id, auto_label: t.auto, openalex_topic: t.oaTop, n: t.n, years: [t.y0, t.y1], terms: t.terms,
      titles: papers.filter(p => paperTopic[p.i] === t.id).sort((a, b) => b.citations - a.citations).slice(0, 40).map(p => (p.year || '') + ' ' + p.title) })),
    phases: phases.map(ph => ({ years: [ph.y0, ph.y1], n: ph.members.length, main_topic: ph.main ? ph.main[0] : null, topic_mix: ph.mix.map(([c, n]) => ({ topic: c, n })),
      terms: ph.terms, rising: ph.rising, fading: ph.fading, collaborators: ph.collabs, affiliations: ph.affs, representative: ph.rep.map(p => (p.year || '') + ' ' + p.title) })),
    network: net ? { center_topic: net.center, core_papers: [...net.prRank.keys()].sort((a, b) => net.prRank[a] - net.prRank[b]).slice(0, 5).map(i => papers[i].title),
      topic_links: [...net.tW].map(([k, w]) => ({ pair: k, w: +w.toFixed(3) })), citation_edges: net.edges.filter(e => e.cites.length).length } : null,
    top_collaborators: coList.slice(0, 10).map(x => ({ name: x.name, n: x.n, inst: x.inst, years: [x.first, x.last] })),
    top_institutions: instList.slice(0, 10).map(g => ({ name: g.name, country: g.country, people: g.people.size, papers: g.papers.size })),
    countries: [...countryAgg].sort((a, b) => b[1].people - a[1].people).slice(0, 10).map(([c, g]) => ({ country: c, people: g.people })),
    ego_affiliations: [...egoAff.values()].map(g => ({ name: g.name, years: [Math.min(...g.years), Math.max(...g.years)], n: g.n }))
  };
}
function fillSelect(sel, opts, cur) { sel.innerHTML = opts.map(o => '<option value="' + o.v + '"' + (o.v === cur ? ' selected' : '') + '>' + esc(o.t) + '</option>').join(''); }

}

  const want = keepP && keepP <= phaseCosts.length ? keepP : INS.phases && INS.phases <= phaseCosts.length && INS.k === K ? INS.phases : pAuto;
  fillSelect($('#p-sel'), pOpts.length ? pOpts : [{ v: 1, t: '1' }], want);

}

}

function init() {
  applyStatic();
  if (typeof echarts === 'undefined') $('#libwarn').innerHTML = '<div class="warn">' + L('图表库 ECharts 未能加载（需要联网）。表格和文字分析仍可查看。', 'The ECharts library could not be loaded (an internet connection is needed). Tables and text remain available.') + '</div>';

  $('#p-sel').onchange = runPhasesAndBelow;
  ['co-top', 'co-min', 'co-color', 'co-noego'].forEach(id => $('#' + id).addEventListener('input', renderFig2));
  ['pn-thr', 'pn-k', 'pn-sim', 'pn-cite', 'pn-co'].forEach(id => $('#' + id).addEventListener('input', () => { renderFig5(); renderFig4(); exportAnalysis(); }));
  $('#pn-q').addEventListener('change', e => {
    const q = e.target.value.trim().toLowerCase(); if (!q) return;
    const p = papers.find(x => x.title.toLowerCase().includes(q));
    if (p) { showPaper(p.i); focusPaper(p.i); }
  });
  const links = [...document.querySelectorAll('nav.toc a')];
  const io = new IntersectionObserver(es => es.forEach(en => { if (en.isIntersecting) links.forEach(a => a.classList.toggle('on', a.getAttribute('href') === '#' + en.target.id)); }), { rootMargin: '-40% 0px -55% 0px' });
  document.querySelectorAll('main .fig').forEach(s => io.observe(s));
  matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => { readTheme(); renderFig3(); runPhasesAndBelow(); });
  matchMedia('(max-width: 900px)').addEventListener('change', renderFig3);
}
