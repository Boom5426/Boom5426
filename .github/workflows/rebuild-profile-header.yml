name: Rebuild profile header

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/rebuild-profile-header.yml"

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install rendering tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y imagemagick fonts-noto-cjk

      - name: Render corrected profile header
        run: |
          mkdir -p assets
          curl -L --fail --retry 3 \
            https://raw.githubusercontent.com/Boom5426/Boom5426.github.io/main/images/research_program_hero.webp \
            -o /tmp/research_program_hero.webp

          CJK_BOLD="$(fc-match -f '%{file}' 'Noto Sans CJK SC:style=Bold' | head -n 1)"
          CJK_REG="$(fc-match -f '%{file}' 'Noto Sans CJK SC:style=Regular' | head -n 1)"
          echo "Using fonts:"
          echo "$CJK_BOLD"
          echo "$CJK_REG"

          # Preserve substantially more of the vertical field than the previous crop,
          # especially the lower feedback arrow.
          convert /tmp/research_program_hero.webp \
            -gravity north \
            -crop 1916x670+0+75 +repage \
            -resize 1600x560 \
            \( -size 1600x560 xc:none \
               -fill "rgba(255,255,255,0.64)" \
               -draw "roundrectangle 455,55 1145,505 30,30" \) \
            -compose over -composite \
            -font "$CJK_BOLD" \
            -fill "#0B315F" \
            -gravity center \
            -pointsize 64 \
            -annotate +0-128 "Bo Li | 李波" \
            -font "$CJK_REG" \
            -fill "#183B66" \
            -pointsize 39 \
            -annotate +0-25 "From Multimodal Virtual Cells" \
            -annotate +0+30 "to Experimental Decisions" \
            -fill "#50667F" \
            -pointsize 23 \
            -annotate +0+116 "AI for Biology · University of Macau · National University of Singapore" \
            -quality 90 \
            assets/profile_header.webp

          identify assets/profile_header.webp

      - name: Commit corrected header and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/rebuild-profile-header.yml
          git add assets/profile_header.webp
          git commit -m "Fix profile header name and crop"
          git push
