name: Build profile header

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-profile-header.yml"

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install rendering tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y imagemagick fonts-noto-cjk

      - name: Render composite README header
        run: |
          mkdir -p assets

          # Use the existing wide scientific banner as the background.
          # Add a soft translucent center veil so the background reads as
          # atmosphere while the identity text remains crisp.
          convert assets/research_program_banner.webp \
            -resize 1600x418^ \
            -gravity center -extent 1600x418 \
            \( -size 1600x418 xc:none \
               -fill "rgba(255,255,255,0.58)" \
               -draw "roundrectangle 420,48 1180,370 30,30" \) \
            -compose over -composite \
            -font "DejaVu-Sans-Bold" \
            -fill "#0B315F" \
            -gravity center \
            -pointsize 62 \
            -annotate +0-82 "Bo Li | 李波" \
            -font "DejaVu-Sans" \
            -fill "#183B66" \
            -pointsize 39 \
            -annotate +0+8 "From Multimodal Virtual Cells" \
            -annotate +0+58 "to Experimental Decisions" \
            -fill "#50667F" \
            -pointsize 24 \
            -annotate +0+126 "AI for Biology · University of Macau · National University of Singapore" \
            -quality 90 \
            assets/profile_header.webp

          identify assets/profile_header.webp

      - name: Commit header and remove one-off workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/build-profile-header.yml
          git add assets/profile_header.webp
          git commit -m "Add composite GitHub profile header"
          git push
